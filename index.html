<style>
/* Layout: sticky status HUD on top, one scrolling stack of cards in the middle, and a thumb-reach footer holding the "next week" button plus five tabs. Single deliberate look: a late-night office in plum and rose. */
:root{
  --bg:#16131d; --surf:#201b2b; --surf2:#2a2338; --line:#3a3150;
  --fg:#f3eefb; --mute:#a99fbd; --rose:#ff6b9a; --rose-d:#c93f70;
  --amber:#ffc45e; --mint:#6fe3c1; --sky:#7cc4ff; --red:#ff6a6a; --violet:#b79bff;
  --disp:'Dela Gothic One','Zen Kaku Gothic New','Hiragino Sans',sans-serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.55;padding-inline:0;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 140px}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(22,19,29,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-in{max-width:720px;margin:0 auto;padding:8px 16px;display:grid;gap:6px}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.co{font-family:var(--disp);font-size:15px;letter-spacing:.02em}
.date{color:var(--mute);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:700}
.chip.money b{color:var(--amber)} .chip.fame b{color:var(--rose)} .chip.conne b{color:var(--mint)}
.chip.neg b{color:var(--red)}
h2{font-family:var(--disp);font-weight:400;font-size:18px;margin:6px 0 10px;letter-spacing:.02em;text-wrap:balance}
h3{font-size:14px;margin:0 0 6px;font-weight:700}
.stack{display:grid;gap:12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r,14px);padding:12px 14px;min-width:0}
.card.hl{border-color:var(--rose)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)} .sm{font-size:12px} .tiny{font-size:11px}
.rose{color:var(--rose)} .amber{color:var(--amber)} .mint{color:var(--mint)} .red{color:var(--red)} .sky{color:var(--sky)}
.btn{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:38px;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--rose)}
.btn:focus-visible,.tab:focus-visible,.pick:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#2a0d19;font-weight:900}
.btn.primary:hover{background:#ff86ae}
.btn.small{padding:5px 9px;min-height:30px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.bar{height:6px;background:var(--surf2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--rose);border-radius:99px}
.bar.b{height:9px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.av{border-radius:14px;flex:none;display:block;background:var(--surf2)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11px;color:var(--mute);line-height:18px}
.tag.love{border-color:var(--rose);color:var(--rose)}
.tag.ssr{border-color:var(--amber);color:var(--amber)}
.tag.sr{border-color:var(--violet);color:var(--violet)}
.tag.r{border-color:var(--sky);color:var(--sky)}
.stars{color:var(--amber);letter-spacing:1px}
.hearts{color:var(--rose);letter-spacing:1px;font-size:12px}
.hearts .off{color:var(--line)}
.sbars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sbars div{font-size:10px;color:var(--mute);text-align:center}
.sbars .bar{height:5px;margin-bottom:2px}
.sbars .bar i{background:var(--c)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tab{background:none;border:0;padding:7px 2px 6px;color:var(--mute);cursor:pointer;font-size:11px;border-radius:8px;min-height:44px}
.tab b{display:block;font-size:15px;font-weight:400;line-height:1.1}
.tab.on{color:var(--rose);background:var(--surf)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rose);margin-left:3px;vertical-align:middle}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(22,19,29,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot-in{max-width:720px;margin:0 auto;padding:8px 12px 4px;display:grid;gap:6px}
.adv{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.ap{display:inline-flex;gap:4px;align-items:center}
.chip.ap{padding-block:5px}
.ap i{width:12px;height:12px;border-radius:50%;background:var(--rose);display:block}
.ap i.off{background:var(--surf2);border:1px solid var(--line)}
.back{position:fixed;inset:0;z-index:50;background:rgba(8,6,12,.72);display:flex;align-items:flex-end;justify-content:center}
.back.scene{z-index:60;align-items:center;padding:16px}
.sheet{background:var(--surf);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92%;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.back.scene .sheet{border-radius:18px;max-height:88%}
.sheet h2{margin-top:0}
.say{background:var(--surf2);border-radius:12px;padding:10px 12px;margin:8px 0;white-space:pre-wrap}
.say.fresh{border-left:3px solid var(--rose)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.acts .btn{display:grid;gap:2px}
.acts .btn small{color:var(--mute);font-size:11px}
.pick{border:1px solid var(--line);background:var(--surf2);border-radius:10px;padding:6px 10px;cursor:pointer}
.pick.on{border-color:var(--rose);background:#3a1f30}
.pick.dim{opacity:.55}
.picks{display:flex;flex-wrap:wrap;gap:6px}
label.f{display:grid;gap:3px;font-size:12px;color:var(--mute)}
select,input[type=text],textarea{background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:11px}
.log{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.log div{padding-left:8px;border-left:2px solid var(--line)}
.log div.hi{border-color:var(--rose);color:var(--fg)}
.log div.gd{border-color:var(--mint);color:var(--fg)}
.log div.bd{border-color:var(--red);color:var(--fg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--mute)}
.ach{display:flex;gap:10px;align-items:center}
.ach .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surf2);border:1px solid var(--line);flex:none;font-size:15px}
.ach.done .ic{background:var(--rose);border-color:var(--rose);color:#2a0d19}
.ach.done{opacity:1}.ach:not(.done){opacity:.6}
.dex{display:flex;gap:10px;align-items:center}
.dex.no .av{filter:brightness(0) opacity(.5)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:#16131d;border-radius:999px;padding:8px 16px;font-weight:700;max-width:90%;text-align:center;pointer-events:none}
.title-big{font-family:var(--disp);font-size:26px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.sep{height:1px;background:var(--line);margin:8px 0}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}}


#fx{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden}
.fh{position:absolute;bottom:-40px;animation:rise linear forwards;opacity:0;filter:drop-shadow(0 0 4px rgba(255,120,170,.6))}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:.95}100%{transform:translateY(-110vh) scale(1.15) rotate(14deg);opacity:0}}
#bubbles{position:fixed;top:calc(env(safe-area-inset-top,0px) + 112px);left:0;right:0;z-index:44;pointer-events:none;display:flex;flex-wrap:wrap;gap:6px;padding:0 10px;justify-content:center;max-height:55vh;overflow:hidden}
.bub{display:flex;align-items:center;gap:6px;background:#fff;color:#2a0d19;border-radius:16px;padding:4px 10px 4px 5px;font-size:12px;font-weight:600;max-width:82vw;box-shadow:0 3px 10px rgba(0,0,0,.35);animation:pop .3s ease-out both}
.bub .av{flex:none}
@keyframes pop{from{transform:scale(.4) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.bub.out{opacity:0;transition:opacity .5s}
.whol{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
@keyframes riseAmb{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:.4}100%{transform:translateY(-110vh) scale(1.1) rotate(10deg);opacity:0}}
.fh.amb{animation-name:riseAmb;filter:none}
@media (prefers-reduced-motion:reduce){.fh{display:none}.bub{animation:none}}
:root[data-tier="1"] .hud{box-shadow:0 2px 14px rgba(255,120,170,.18)}
:root[data-tier="2"] .hud{background-image:linear-gradient(90deg,rgba(255,120,170,.14),transparent);box-shadow:0 2px 16px rgba(255,120,170,.28)}
:root[data-tier="3"] .hud{background-image:linear-gradient(90deg,rgba(255,120,170,.22),rgba(255,190,90,.12),transparent);box-shadow:0 2px 20px rgba(255,150,120,.38)}
:root[data-tier="4"] .hud{background-image:linear-gradient(90deg,rgba(255,110,170,.3),rgba(255,200,90,.22),rgba(255,110,170,.3));box-shadow:0 2px 24px rgba(255,190,110,.55);border-bottom:1px solid var(--amber)}
.rank{display:flex;gap:6px;align-items:center;font-size:12px}
.chat{display:grid;gap:8px}
.crow{display:flex;gap:8px;align-items:flex-start}
.crow .cb{background:var(--surf2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:6px 10px;font-size:13px;line-height:1.5}

html{background:var(--bg)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
</style>

function genEmp(o={}){
  const rar=o.rar!=null?o.rar:wpick([70,25,5,0]);
  const g=o.g||(Math.random()<.65?'F':'M');
  const e={id:S.nextId++,g,rar,type:RI(0,7),seed:RI(1,1e9),age:o.young?RI(20,23):RI(21,36),lv:1,exp:0,star:0,mot:60,fat:0,aff:0,lover:false,bond:0,dateW:-99,seen:0,pj:null,leave:false,act:{n:0},last:0,raise:0,likes:{},tr:[],named:null,kids:0,preg:0,mat:0,inv:null,invW:0,bd:RI(0,47),heartW:-99,tot:0};
  const [lo,hi]=RAR_BASE[rar];
  e.s=[0,0,0,0,0].map(()=>R(lo,hi));
  e.s[RI(0,4)]*=1.5; if(Math.random()<.4)e.s[RI(0,4)]*=1.25;
  e.s=e.s.map(v=>Math.round(v));
  e.pot=+R(...RAR_POT[rar]).toFixed(2); if(o.young)e.pot=+(e.pot*1.15).toFixed(2);
  const nt=rar>=2?2:(Math.random()<.6?1:0); const pool=TRAIT_KEYS.slice();
  for(let i=0;i<nt;i++){e.tr.push(pool.splice(RI(0,pool.length-1),1)[0])}
  e.name=pick(SUR)+' '+(g==='F'?pick(FN):pick(MN));
  e.apt=e.s.map(v=>v/e.s.reduce((a,b)=>a+b,0));
  return e;
}

function adCost(a){if(a.free||a.conne)return 0;return Math.round(a.cost*(1+(G.hireF?.5:0))*(1-Math.min(.3,S.pres.net*.003)))}
function recruit(id){
  const a=ADS.find(x=>x.id===id);
  if(a.free&&S.week-S.schoolAt<4)return toast('推薦枠はあと'+(4-(S.week-S.schoolAt))+'週で使えます');
  if(a.conne&&S.conne<a.conne)return toast('コネが足りません');
  const c=adCost(a); if(S.money<c)return toast('資金が足りません');
  S.money-=c; if(a.conne)S.conne-=a.conne; if(a.free)S.schoolAt=S.week;
  S.cand=S.cand.filter(x=>x.exp>S.week);
  const eye=perk('eye'); const w=a.w.slice(); w[2]+=eye*3;w[3]+=eye*1.2;w[0]=Math.max(0,w[0]-eye*3);
  const owned=new Set(S.staff.map(e=>e.named).concat(S.cand.map(e=>e.named)).filter(Boolean));
  const made=[];
  for(let i=0;i<a.cnt;i++){
    let rar=wpick(w);
    if(a.id==='head'){S.pity++; if(S.pity>=10&&i===0){rar=3;S.pity=0}else if(rar===3)S.pity=0}
    let c1=null;
    if(rar>=2&&(a.named||Math.random()<.15)){
      const pool=NAMED.filter(n=>n.rar===rar&&!owned.has(n.id)&&(!G.hireF||(n.g||'F')==='F'));
      if(pool.length&&Math.random()<(a.named?.55:.3)){const n=pick(pool);owned.add(n.id);c1=fromNamed(n)}
    }
    if(!c1){
      let g=G.hireF?'F':(Math.random()<.5?'F':'M'); c1=genEmp({rar,g,young:a.young});
    }
    c1.rev=false;c1.exp=S.week+4;c1.cid=c1.id;made.push(c1);S.cand.push(c1);
  }
  logm(`${a.n}：${made.length}名の応募があった`,'hi');
  if(made.some(x=>x.rar===3))toast('✨ SSRの応募者がいます！');
  checkAch();save();render();
}
function hire(id){
  const i=S.cand.findIndex(c=>c.id===id); if(i<0)return;
  const c=S.cand[i];
  if(S.staff.length>=capacity())return toast('オフィスがいっぱいです。拡張しましょう');
  const fee=Math.round(salOf(c)*1.5); if(S.money<fee)return toast('契約金が足りません');
  S.money-=fee;S.cand.splice(i,1);delete c.rev;delete c.cid;c.exp=0;c.mot=75;c.last=S.week;
  if(S.proj[0])c.pj=S.proj[0].id;
  S.staff.push(c);S.stat.hired++;S.stat.maxStaff=Math.max(S.stat.maxStaff,S.staff.length);
  if(c.named)S.dex[c.named]=true; if(c.g==='F')S.typeDex[c.type]=true;
  logm(`${c.name} が入社した（${RAR[c.rar]}・${JOBS[jobOf(c)]}）`,'gd');
  if(c.named){const n=NAMED.find(x=>x.id===c.named);scene({who:c,title:'新入社員',html:`<b>${esc(c.name)}</b>\n${esc(n.bio)}\n\n${esc(n.intro)}`})}
  else toast(c.name+' が入社しました');
  checkAch();save();render();
}

function addAff(e,v,silent){
  const b=stageOf(e);e.aff=clamp(e.aff+v,0,100);e.last=S.week;const a=stageOf(e);
  if(!silent&&e.g==='F')for(let s=b+1;s<=a;s++){if(s>e.seen){e.seen=s;stageScene(e,s)}}
  else if(e.g!=='F')e.seen=a;
}
function affGain(e,base){
  const rep=e.act.n||0;e.act.n=rep+1;e.tot=(e.tot||0)+1;
  let g=base*Math.pow(.75,rep)*(S.room.items.sofa?1.1:1)*(1+S.pres.cha*.01+perk('charm')*.08)*tMul(e,'aff')*(e.lover?1.2:1)*R(.85,1.15);
  g=Math.max(.5,g);addAff(e,g);gainPres('cha',1);return g;
}
function gainPres(k,v){
  const p=S.pres;p.exp[k]+=v;
  while(p.exp[k]>=p[k]*10+10){p.exp[k]-=p[k]*10+10;p[k]++;toast(({plan:'企画力',biz:'経営力',cha:'魅力',net:'人脈'})[k]+'が Lv'+p[k]+' に上がった！')}

function gainExp(e,v){
  v*=tMul(e,'exp')*(1+.08*fac('lib'))*(1+.1*perk('edu'))*(1+.03*S.rd.edu);e.exp+=v;
  while(e.exp>=needExp(e)&&e.lv<lvCap(e)){e.exp-=needExp(e);levelUp(e);if(e.lv%5===0)logm(`${e.name} が Lv${e.lv} になった`)}
  if(e.lv>=lvCap(e))e.exp=Math.min(e.exp,needExp(e));
}

/* ====== projects ====== */
const projProg=p=>{let a=0,b=0;for(let k=0;k<5;k++){a+=Math.min(p.pts[k],p.tgt[k]);b+=p.tgt[k]}return a/b};
const genreLv=g=>Math.min(10,Math.floor(Math.sqrt(S.gexp[g]*2)));
const themeLv=t=>Math.min(10,Math.floor(Math.sqrt(S.texp[t]*2)));
const slotsMax=()=>SLOTS[S.office];
function startProject(){
  const f=G.form;const sc=SCALES[f.sc],pf=PLATS[f.pf];
  if(S.proj.length>=slotsMax())return toast('開発スロットが埋まっています');
  if(sc.unlock>S.office||pf.unlock>S.office)return toast('オフィスを拡張すると解放されます');
  const gw=GENRES[f.g].w;const T=sc.T*pf.t;
  const p={id:S.nextId++,kind:'game',title:(f.title||'').trim()||(pick(TITLE_A)+pick(TITLE_B)),g:f.g,t:f.t,pf:f.pf,sc:f.sc,
    tgt:gw.map(w=>Math.round(T*w/5)),pts:[0,0,0,0,0],hype:0,start:S.week};
  S.proj.push(p);G.form.title='';
  for(const e of S.staff)if(!e.pj)e.pj=p.id;
  logm(`開発開始：『${p.title}』（${GENRES[p.g].n}×${THEMES[p.t]}）`,'hi');
  save();render();
}
function projOut(p){
  const out=[0,0,0,0,0];
  for(const e of S.staff){if(e.pj!==p.id||e.leave)continue;const m=outMul(e);for(let k=0;k<5;k++)out[k]+=effStat(e,k)*m*.9*((k===2||k===4)?1+.05*fac('studio'):1)}
  const pr=(3+S.pres.plan*1.1+(S.room.items.desk?2:0))*(1+.04*perk('speed'));
  for(let k=0;k<5;k++)out[k]+=pr;
  return out;
}
function calcScore(p){
  let a=0,b=0;for(let k=0;k<5;k++){a+=p.tgt[k]*Math.min(1.8,p.pts[k]/p.tgt[k]);b+=p.tgt[k]}
  const Q=a/b, c=compat(p.g,p.t);
  const team=S.staff.filter(e=>e.pj===p.id);
  let tq=1;const used=new Set();for(const e of team)for(const t of e.tr)if(TRAITS[t].q&&!used.has(t)){used.add(t);tq*=TRAITS[t].q}tq=Math.min(1.15,tq);
  const trend=(S.trend.g===p.g?1.07:1)*(S.trend.t===p.t?1.07:1);
  const fat=team.length?team.reduce((x,e)=>x+e.fat,0)/team.length:0;
  const raw=6.2*Q*c*(1+S.pres.plan*.004)*tq*(1+genreLv(p.g)*.03+themeLv(p.t)*.02)*trend*(fat>70?.92:1)*Math.min(1,.55+projProg(p)*.45);
  return clamp(1+9*(1-Math.exp(-raw/6.5))+R(-.35,.35),1,10);
}
function releaseProject(p){
  S.proj=S.proj.filter(x=>x!==p);
  for(const e of S.staff)if(e.pj===p.id)e.pj=null;
  if(p.kind==='contract'){
    S.money+=p.reward;S.stat.rev+=p.reward;S.revAll+=p.reward;S.stat.contracts++;S.fame+=1;
    logm(`受託完了：『${p.title}』報酬 ${yen(p.reward)}`,'gd');
    scene({title:'受託案件、完了！',html:`『${esc(p.title)}』を納品しました。\n報酬 <b class="amber">${yen(p.reward)}</b> が入金されました。`});
    return;
  }
  const score=calcScore(p);const sc=SCALES[p.sc],pf=PLATS[p.pf];
  const hype=1+p.hype*.08;
  const trendS=(S.trend.g===p.g?1.15:1)*(S.trend.t===p.t?1.15:1);
  const act=S.released.filter(x=>!x.done).length;
  let units=(900+Math.pow(S.fans,.8)*.3)*sc.u*pf.u*Math.pow(score/6,3.2)*hype*trendS*R(.8,1.25)*(1+.06*perk('sales'))*(1+.02*S.rd.mkt)*(1+Math.min(.3,S.club.n*.002))/(1+.1*act);
  units=Math.round(units);
  const price=pf.price*(p.sc>=2?1:1);
  const g={id:p.id,title:p.title,g:p.g,t:p.t,pf:p.pf,sc:p.sc,score:+score.toFixed(1),units,price,age:0,sold:0,rev:0,week:S.week,done:false};
  S.released.unshift(g);
  const tf=S.staff.some(e=>e.tr.includes('idol'))?1.05:1;
  const fg=Math.round(Math.max(0,score-5.5)*sc.fame*(1+.08*fac('pr'))*tf);
  S.fame+=fg;S.fans+=Math.round(units*(score>=6?.2:.04)/(1+S.fans/3e6));
  S.gexp[p.g]++;S.texp[p.t]++;S.known[p.g+'-'+p.t]=true;S.stat.games++;
  if(score>=8)S.stat.hits++;S.stat.best=Math.max(S.stat.best,score);
  for(const e of S.staff)gainExp(e,15*(1+p.sc));
  const word=score>=9?'神ゲー！！':score>=8?'大ヒットの予感！':score>=7?'好評スタート':score>=5.5?'まずまずの評価':'厳しい評価…';
  logm(`発売：『${p.title}』スコア ${score.toFixed(1)}（${word}）`,score>=7?'gd':score<5.5?'bd':'hi');
  scene({title:'発売！ レビュー結果',html:`『${esc(p.title)}』\n<span class="mute">${GENRES[p.g].n}×${THEMES[p.t]}（相性 ${compatMark(compat(p.g,p.t))}）／${pf.n}／${sc.n}</span>\n\n<b style="font-size:24px" class="rose">${score.toFixed(1)} / 10</b>　${word}\n初動予測 <b>${num(units)}本</b>・知名度 +${fg}`});
  if(score>=8&&S.staff.length>=5)uchiage(g.title);
}
function stepProjects(){
  for(const p of S.proj.slice()){
    const out=projOut(p);for(let k=0;k<5;k++)p.pts[k]+=out[k];
    p.age=(p.age||0)+1;
    if(p.kind==='contract'&&S.week>=p.deadline){
      S.proj=S.proj.filter(x=>x!==p);for(const e of S.staff)if(e.pj===p.id)e.pj=null;
      S.fame=Math.max(0,S.fame-3);logm(`受託案件『${p.title}』は納期に間に合わなかった…`,'bd');continue}
    if(projProg(p)>=1)releaseProject(p);
  }
}
function stepSales(){
  let tot=0;
  for(const g of S.released){
    if(g.done)continue;const d=.68;const sh=(1-d)*Math.pow(d,g.age);
    const u=Math.round(g.units*sh*(g.age===0?1:1));const rev=u*g.price*(1+.06*perk('sales')*0);
    g.sold+=u;g.rev+=rev;g.age++;tot+=rev;
    if(g.age>=14||sh<.002){g.done=true}
  }
  S.money+=tot;S.stat.rev+=tot;S.revAll+=tot;return tot;
}
function genContracts(){
  S.contracts=[];
  const base=250*(1+S.office*1.9+S.staff.length*.12);
  for(let i=0;i<3;i++){
    const T=Math.round(base*R(.7,1.6));const w=[0,0,0,0,0].map(()=>R(.5,1.5));const ws=w.reduce((a,b)=>a+b,0);
    S.contracts.push({id:S.nextId++,kind:'contract',title:pick(['企業PRゲーム','学習アプリ','スマホ運用代行','アニメ連動ミニゲーム','販促キャンペーンアプリ','既存タイトルの移植','キャラ素材の制作'])+'の受託',
      tgt:w.map(x=>Math.round(T*x/ws)),pts:[0,0,0,0,0],reward:Math.round(T*R(1500,2200)),dl:RI(6,10),hype:0});
  }
}

function checkAch(){
  for(const a of ACHS){
    if(S.ach[a.id])continue;
    let ok=false;try{ok=a.c()}catch(e){}
    if(ok){S.ach[a.id]=S.week+1;if(a.r.conne)S.conne+=a.r.conne;if(a.r.money)S.money+=a.r.money;
      logm(`実績「${a.n}」を達成！`,'hi');toast('🏆 実績「'+a.n+'」');}
  }
}

function seasonal(){
  const c=cal();
  if(c.wk===2&&c.mo===2){const l=S.staff.filter(e=>e.g==='F'&&e.aff>=28);
    if(l.length){const n=l.reduce((a,e)=>a+(e.lover?3:e.aff>=62?2:1),0);S.stat.choco+=n;S.stat.recv+=n;for(const e of l)bulkAff(e,e.lover?4:2);
      scene({title:'🍫 バレンタインデー',html:`${l.length}人の社員から、合計 <b class="rose">${n}個</b> のチョコレートをもらった！\n社長室の机が、チョコの山になっている。\n（好感度アップ）`})}}
  if(c.wk===2&&c.mo===3){const l=S.staff.filter(e=>e.g==='F'&&e.aff>=28);
    if(l.length){const opt=(label,per,aff,pri)=>({l:`${label}（${yen(per*l.length)}）`,p:pri,f:()=>{const c2=per*l.length;if(S.money<c2)return toast('資金が足りません');S.money-=c2;for(const e of l)bulkAff(e,aff);logm(`ホワイトデーのお返し（${l.length}人）`,'gd');toast('お返し大作戦、成功！ 好感度+'+aff);save();render()}});
      scene({title:'🎁 ホワイトデー大作戦',html:`${l.length}人にお返しをする日。予算をどうする？`,btns:[opt('義理の小さなお菓子',1000,2),opt('心を込めた贈り物',5000,6,1),opt('高級ブランドの贈り物',15000,12),{l:'今年はスルー',f:()=>{for(const e of l)e.aff=Math.max(0,e.aff-3)}}]})}}
  if(c.wk===3&&c.mo===7){const fl=S.staff.filter(e=>e.g==='F'&&e.aff>=28);

const IMG={avail:[],src:{},mavail:[],msrc:{}};
const rebuildImg=()=>{IMG.avail=Object.keys(IMG.src).map(Number).sort((a,b)=>a-b);IMG.mavail=Object.keys(IMG.msrc).map(Number).sort((a,b)=>a-b)};
const tryLoad=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=u});
async function loadImages(){
  const pad=n=>String(n).padStart(3,'0');
  const probe=pre=>Promise.all(Array.from({length:100},(_,i)=>tryLoad(pre+pad(i+1)+'.jpg').then(ok=>ok?i+1:0)));
  try{
    const [f,m]=await Promise.all([probe(''),probe('man')]);
    for(const n of f)if(n)IMG.src[n]=pad(n)+'.jpg';
    for(const n of m)if(n)IMG.msrc[n]='man'+pad(n)+'.jpg';
  }catch(e){}
  rebuildImg();render();
}
const poolOf=e=>e.g==='F'?{av:IMG.avail,src:IMG.src}:{av:IMG.mavail,src:IMG.msrc};
function ensureImg(e){
  const P=poolOf(e);if(!P.av.length)return null;
  if(e.img!=null&&P.src[e.img])return P.src[e.img];
  const used=new Set();for(const x of S.staff.concat(S.cand))if(x.g===e.g&&x.img!=null&&P.src[x.img])used.add(x.img);
  const free=P.av.filter(n=>!used.has(n));const pool=free.length?free:P.av;
  e.img=pool[Math.floor(Math.random()*pool.length)];return P.src[e.img];
}

      empAct(+d.id,d.k,d.x===''?null:(d.x!==undefined?+d.x:undefined));break}

    G.locked=true;
    showModal(()=>`<div class="title-big">ドリームピクセルスタジオ</div><div class="sm mute" style="margin-bottom:12px">小さなオフィスから、世界一のゲーム会社へ。</div>
     <div class="row" style="margin-bottom:12px;flex-wrap:nowrap">${avatar(S.staff[0],64)}${avatar(S.staff[1],64)}<div class="grow sm"><b>${esc(S.staff[0].name)}</b>と<b>${esc(S.staff[1].name)}</b>が最初の社員として入社してくれました。<br>「社長、これからよろしくお願いします！」</div></div>
     <label class="f">会社名<input type="text" id="coName" value="${esc(S.name)}" maxlength="16"></label>
     <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" data-a="startGame">経営スタート</button></div>`);
  }
  render();
}
G.limit=30;
(function boot(){
  const s=load();
  if(s){S=s;if(!S.contracts.length)genContracts()}else S=newState();
  initGame();
  loadImages();
})();

;if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

</script>
